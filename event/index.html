<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pinfo - Event</title>

  <!-- Smart App Banner. The app-argument is filled per-event by the script. -->
  <meta id="smart-banner" name="apple-itunes-app" content="app-id=6463236759" />

  <!-- Open Graph (rich previews when the link is shared in chats/social). Filled
       in by the script with the real title/cover. -->
  <meta property="og:type" content="website" />
  <meta property="og:url" id="og-url" content="https://pinfoapp.com/" />
  <meta property="og:title" id="og-title" content="An event on Pinfo" />
  <meta property="og:description" id="og-description" content="Discover events near you on Pinfo." />
  <meta property="og:image" id="og-image" content="https://pinfoapp.com/assets/pinfo-bb.png" />
  <meta property="og:site_name" content="Pinfo" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" id="twitter-title" content="An event on Pinfo" />
  <meta name="twitter:description" id="twitter-description" content="Discover events near you on Pinfo." />
  <meta name="twitter:image" id="twitter-image" content="https://pinfoapp.com/assets/pinfo-bb.png" />

  <link rel="icon" href="/assets/pinfo-bb.png" type="image/png">

  <style>
    :root {
      --indigo: #4f46e5;
      --indigo-deep: #3730a3;
      --ink: #1c1c28;
      --muted: #6b6b7b;
      --card: #ffffff;
      --bg: #f4f3fb;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(160deg, #ede9fe 0%, var(--bg) 55%);
      color: var(--ink);
      display: flex; align-items: center; justify-content: center;
      padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
      min-height: 100%;
    }
    .card {
      width: 100%; max-width: 420px; background: var(--card);
      border-radius: 24px; overflow: hidden;
      box-shadow: 0 18px 50px rgba(55, 48, 163, 0.18);
    }
    .cover {
      width: 100%; aspect-ratio: 16 / 10; object-fit: cover; display: block;
      background: linear-gradient(135deg, var(--indigo), var(--indigo-deep));
    }
    .body { padding: 22px 22px 26px; }
    .brand {
      display: inline-flex; align-items: center; gap: 7px;
      font-weight: 700; color: var(--indigo); font-size: 15px; margin-bottom: 12px;
    }
    .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--indigo); }
    h1 { font-size: 23px; line-height: 1.25; margin: 0 0 8px; letter-spacing: -0.2px; }
    .meta { color: var(--muted); font-size: 15px; margin: 0 0 22px; }
    .btn {
      display: block; width: 100%; text-align: center; text-decoration: none;
      padding: 15px 16px; border-radius: 14px; font-size: 16px; font-weight: 600;
      border: none; cursor: pointer; margin-top: 10px;
    }
    .btn-primary { background: var(--indigo); color: #fff; }
    .btn-primary:active { background: var(--indigo-deep); }
    .btn-store { background: #111; color: #fff; }
    .hint { text-align: center; color: var(--muted); font-size: 13px; margin-top: 16px; }
    .hidden { display: none; }
    .skeleton { background: #ece9f6; color: transparent; border-radius: 8px; animation: pulse 1.3s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .55; } }
  </style>
</head>
<body>
  <main class="card" role="main">
    <img id="cover" class="cover" alt="" />
    <div class="body">
      <span class="brand"><span class="dot"></span> Pinfo</span>
      <h1 id="title" class="skeleton">Loading event...</h1>
      <p id="meta" class="meta skeleton">&nbsp;</p>

      <!-- Only shown for magic invite links (?t=<token> present). The token
           is never sent anywhere or validated here - claiming an invite
           happens only inside the app, via an authenticated call. -->
      <div id="actions" class="hidden">
        <a id="get-pinfo" class="btn btn-primary" href="https://apps.apple.com/app/id6463236759">Get Pinfo</a>
        <a id="open-invite" class="btn btn-store" href="#">I have Pinfo - open my invite</a>
        <p class="hint">Installed Pinfo? Tap 'open my invite' to join.</p>
      </div>
    </div>
  </main>

  <script>
    // ---- Config -------------------------------------------------------------
    var SUPABASE_URL = "https://ftmwhexhxdskasskzglp.supabase.co";
    // Publishable (client-safe) key - same one shipped in the app; RLS still applies.
    var SUPABASE_KEY = "sb_publishable_ESy4TzFh9kWTef57Bfoufg_D3ZSvKEv";

    document.getElementById("og-url").setAttribute("content", location.href);

    // ---- Which route is this? -------------------------------------------------
    // Three link shapes all land on this same page:
    //   /event/<uuid>            - direct event link, optionally with ?t=<token>
    //   /e/<code>                - short link, 8 chars from a base32-like alphabet
    //   /i/<token>                - invite link (new 10-char token, or a legacy
    //                                24-character url-safe token)
    // Everything below resolves whichever shape matched down to a plain
    // { id, token, ev } before rendering, so the rest of the page never needs
    // to know which URL shape got it there.
    var CODE_RE = /^[23456789abcdefghjkmnpqrstuvwxyz]{8}$/;
    var NEW_TOKEN_RE = /^[23456789abcdefghjkmnpqrstuvwxyz]{10}$/;
    var LEGACY_TOKEN_RE = /^[A-Za-z0-9_-]{24}$/;

    function parseRoute() {
      var path = location.pathname;
      var m;
      if ((m = path.match(/\/event\/([0-9a-fA-F-]{36})/))) {
        return { kind: "event", id: m[1] };
      }
      if ((m = path.match(/\/e\/([^\/?#]+)/)) && CODE_RE.test(m[1])) {
        return { kind: "code", code: m[1] };
      }
      if ((m = path.match(/\/i\/([^\/?#]+)/)) && (NEW_TOKEN_RE.test(m[1]) || LEGACY_TOKEN_RE.test(m[1]))) {
        return { kind: "invite", token: m[1] };
      }
      var qid = new URLSearchParams(location.search).get("id");
      if (qid) return { kind: "event", id: qid };
      return { kind: "none" };
    }

    function supabaseRpc(name, body) {
      return fetch(SUPABASE_URL + "/rest/v1/rpc/" + name, {
        method: "POST",
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: "Bearer " + SUPABASE_KEY,
          "Content-Type": "application/json"
        },
        body: JSON.stringify(body)
      }).then(function (r) { return r.ok ? r.json() : null; })
        .catch(function () { return null; });
    }

    function fetchEventById(id) {
      var url = SUPABASE_URL + "/rest/v1/events?id=eq." + id +
                "&select=title,image_url,cover_url_app,cover_url_original,date_start&limit=1";
      return fetch(url, { headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY } })
        .then(function (r) { return r.ok ? r.json() : []; })
        .then(function (rows) { return rows && rows[0]; })
        .catch(function () { return null; });
    }

    // ---- Magic invite links (?t=<token> or /i/<token>) -------------------------
    // The token is read only to build the pinfo:// link below - it is never
    // sent to Supabase or any other endpoint (get_invite_preview takes only
    // the token itself, never anything that would "claim" it), and it is
    // never validated here. Claiming an invite happens only inside the app,
    // via an authenticated call; if loading this page consumed the invite, a
    // chat app's preview bot (which fetches the link to build the card)
    // would burn it before the person ever tapped. Links without a token
    // render with no buttons, exactly as before.
    //
    // The button has to use the pinfo:// scheme rather than the https link:
    // a pinfoapp.com link tapped from a page already on pinfoapp.com stays
    // in Safari, since Universal Links only fire when coming from another
    // app.
    function activateInvite(id, token) {
      document.getElementById("open-invite").href =
        "pinfo://event/" + id + "?t=" + encodeURIComponent(token);
      document.getElementById("actions").classList.remove("hidden");
    }

    function setSmartBannerTarget(url) {
      var banner = document.getElementById("smart-banner");
      var base = banner.getAttribute("content");
      banner.setAttribute("content", base + ", app-argument=" + url);
    }

    // ---- Render the page from event data -------------------------------------
    function fmtDate(iso) {
      if (!iso) return "";
      try {
        return new Date(iso).toLocaleString(undefined, {
          weekday: "short", month: "short", day: "numeric",
          hour: "2-digit", minute: "2-digit"
        });
      } catch (e) { return ""; }
    }

    function render(ev) {
      var titleEl = document.getElementById("title");
      var metaEl = document.getElementById("meta");
      titleEl.classList.remove("skeleton");
      metaEl.classList.remove("skeleton");
      titleEl.textContent = (ev && ev.title) ? ev.title : "View this event on Pinfo";
      metaEl.textContent = (ev && ev.date_start) ? fmtDate(ev.date_start) : "";

      var cover = ev && (ev.cover_url_app || ev.image_url || ev.cover_url_original);
      var img = document.getElementById("cover");
      if (cover) { img.src = cover; img.alt = ev.title || "Event cover"; }
      else { img.remove(); }

      if (ev && ev.title) {
        document.title = ev.title + " - Pinfo";
        var description = ev.date_start ? "On Pinfo - " + fmtDate(ev.date_start) : "Discover this event on Pinfo.";
        document.getElementById("og-title").setAttribute("content", ev.title);
        document.getElementById("og-description").setAttribute("content", description);
        document.getElementById("twitter-title").setAttribute("content", ev.title);
        document.getElementById("twitter-description").setAttribute("content", description);
        if (cover) {
          document.getElementById("og-image").setAttribute("content", cover);
          document.getElementById("twitter-image").setAttribute("content", cover);
        }
      }
    }

    // Finishes the page for a resolved (or unresolved) event: wires up the
    // smart banner and invite buttons if there's an id/token, then renders
    // either the already-known event data (preloadedEv, used for /i/<token>
    // since get_invite_preview already returns exactly what's needed) or
    // fetches it by id (used for /event/<uuid> and /e/<code>). No id at all
    // (unknown code, unknown/expired token, bad or missing path) renders the
    // generic "not found" card - never an error, never a guessed link.
    function finish(id, token, preloadedEv) {
      if (id) setSmartBannerTarget(location.href);
      if (id && token) activateInvite(id, token);

      if (preloadedEv !== undefined) {
        render(preloadedEv);
      } else if (id) {
        fetchEventById(id).then(render);
      } else {
        render(null);
      }
    }

    var route = parseRoute();
    if (route.kind === "event") {
      finish(route.id, new URLSearchParams(location.search).get("t"));
    } else if (route.kind === "code") {
      supabaseRpc("resolve_event_code", { _code: route.code }).then(function (id) {
        finish(typeof id === "string" && id ? id : null, null);
      });
    } else if (route.kind === "invite") {
      supabaseRpc("get_invite_preview", { _token: route.token }).then(function (preview) {
        if (preview && preview.event_id) {
          finish(preview.event_id, route.token, {
            title: preview.title,
            date_start: preview.date_start,
            image_url: preview.image_url
          });
        } else {
          finish(null, null);
        }
      });
    } else {
      finish(null, null);
    }
  </script>
</body>
</html>
